{% extends "base.html" %}
{% block content %}

<h2 class="text-2xl font-bold mb-4">Add an Event</h2>

<form method="post" class="bg-gray-800 p-6 rounded-lg shadow-lg space-y-4 mb-8">
    <div>
        <label class="block mb-1">Date:</label>
        <input type="date" name="date" value="{{ today }}" required class="w-full p-2 rounded text-black">
    </div>

    <div>
        <label class="block mb-1">Event / Note:</label>
        <input type="text" name="note" required class="w-full p-2 rounded text-black">
    </div>

    <div>
        <label class="block mb-1">Colour:</label>
        <input type="color" name="colour" value="#ffffff" class="w-full p-1 rounded">
    </div>

    <div>
        <label class="block mb-1">Icon:</label>
        <select name="icon" class="w-full p-2 rounded text-black">
            <option value="">None</option>
            <option value="📅">Meeting</option>
            <option value="🎂">Birthday</option>
            <option value="⭐">Important</option>
            <option value="💼">Work</option>
            <option value="🛠">Personal</option>
        </select>
    </div>

    <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2 rounded transition duration-300 ease-in-out">
        Add Event
    </button>
</form>

<h2 class="text-2xl font-bold mb-4">Upcoming Events</h2>
<ul class="space-y-2">
    {% for e in events %}
        <li class="rounded p-3 transition ease-in-out duration-300 hover:scale-[1.02]"
            style="background-color:{{ e['colour'] }}">
            <div class="flex justify-between items-center">
                <span>{{ e['date'] }} {{ e['icon'] }} {{ e['note'] }}</span>
                <a href="{{ url_for('delete', event_id=e['id']) }}" class="text-red-300 hover:text-red-500">[Delete]</a>
            </div>
        </li>
    {% else %}
        <li class="text-gray-400">No events yet.</li>
    {% endfor %}
</ul>

{% endblock %}
