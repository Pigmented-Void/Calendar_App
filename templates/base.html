<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ title if title else "My Calendar" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

<header class="bg-gray-800 p-4 shadow-lg">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold">📅 My Calendar</h1>
        <nav class="space-x-4">
            <a href="{{ url_for('index') }}" class="hover:underline">Home</a>
            <a href="{{ url_for('calendar_view') }}" class="hover:underline">Calendar View</a>
        </nav>
    </div>
</header>

<main class="flex-grow max-w-4xl mx-auto w-full p-4">
    {% block content %}{% endblock %}
</main>

<footer class="bg-gray-800 p-4 text-center text-gray-400 text-sm">
    &copy; {{ date.today().year }} My Calendar App
</footer>

</body>
</html>
